name: Phase 1 CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main, 'feature/phase-1-foundation']
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Replace npm install with npm ci once package-lock.json is committed.
      - run: npm install
      - run: npm run check
      - run: npm test
      - run: npm run build
